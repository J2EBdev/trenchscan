<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrenchScan – Auto Memecoin Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e11;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 20px 14px 70px;
    }
    .header {
      text-align: center;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #f0b90b;
    }
    .header p {
      color: #848e9c;
      font-size: 13px;
      margin-top: 4px;
    }
    .section {
      background: #1e2329;
      border: 1px solid #2b3139;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 16px;
    }
    .section h2 {
      font-size: 14px;
      color: #f0b90b;
      margin-bottom: 6px;
    }
    .section p {
      font-size: 13px;
      color: #c0c5ce;
    }
    .status {
      text-align: center;
      color: #848e9c;
      font-size: 13px;
      margin: 12px 0;
    }
    .card {
      background: #161a1e;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 12px;
      border: 1px solid #2b3139;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .coin-left {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 1;
      min-width: 0;
    }
    .coin-img {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #2b3139;
      object-fit: cover;
      flex-shrink: 0;
    }
    .coin-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .coin-symbol {
      font-size: 12px;
      color: #848e9c;
      margin-top: 2px;
    }
    .badges {
      display: flex;
      flex-direction: column;
      gap: 4px;
      align-items: flex-end;
    }
    .badge {
      font-size: 10px;
      font-weight: 600;
      padding: 3px 7px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .badge.new { background: #2b3139; color: #848e9c; }
    .badge.hot { background: #f0b90b33; color: #f0b90b; }
    .badge.risk { background: #f6465d33; color: #f6465d; }
    .info-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 11px;
      color: #848e9c;
      margin-bottom: 11px;
    }
    .info-row span {
      background: #1e2329;
      padding: 3px 7px;
      border-radius: 6px;
    }
    .buttons {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 6px;
    }
    .btn {
      text-align: center;
      padding: 8px 4px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 600;
      text-decoration: none;
      color: white;
    }
    .btn-jupiter { background: #00d18c; }
    .btn-dex { background: #3861fb; }
    .btn-gmgn { background: #f0b90b; color: #0b0e11; }
    .btn-axiom { background: #7b61ff; }
    .btn-photon { background: #00b4d8; }
    .btn-copy {
      background: #2b3139;
      color: #eaecef;
      border: none;
      width: 100%;
      padding: 8px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      grid-column: span 3;
    }
    .footer {
      text-align: center;
      color: #5e6673;
      font-size: 12px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TrenchScan</h1>
    <p>Auto-analyzing new memecoins • Faster decisions</p>
  </div>

  <div class="section">
    <h2>What is TrenchScan?</h2>
    <p>Automatically analyzes new memecoins (age, liquidity, market cap, basic risk) so you don’t waste time pasting CAs and checking multiple sites.</p>
  </div>

  <div class="status" id="status">Loading latest tokens...</div>
  <div id="feed"></div>

  <div class="footer">TrenchScan • Built for speed</div>

  <script>
    function formatNumber(num) {
      if (!num) return '—';
      num = Number(num);
      if (num >= 1000000) return '$' + (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return '$' + (num / 1000).toFixed(1) + 'K';
      return '$' + num.toFixed(0);
    }

    function getAge(createdAt) {
      if (!createdAt) return null;
      var minutes = Math.floor((Date.now() - createdAt) / 60000);
      if (minutes < 60) return minutes + 'm';
      var hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h';
      return Math.floor(hours / 24) + 'd';
    }

    function copyAddress(address) {
      navigator.clipboard.writeText(address).then(function() {
        alert('Address copied!');
      }).catch(function() {
        prompt('Copy this address:', address);
      });
    }

    async function loadCoins() {
      var feed = document.getElementById('feed');
      var status = document.getElementById('status');

      try {
        var res = await fetch('/.netlify/functions/get-tokens');
        var data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          status.textContent = 'No tokens found right now...';
          return;
        }

        status.textContent = 'Showing ' + data.length + ' latest Solana tokens • Auto-refreshing';

        feed.innerHTML = '';

        data.forEach(function(token) {
          var age = getAge(token.createdAt);
          var minutes = token.createdAt ? Math.floor((Date.now() - token.createdAt) / 60000) : 999;
          var isVeryNew = minutes < 20;
          var lowLiq = token.liquidity && token.liquidity < 8000;

          var badges = '';
          if (isVeryNew) badges += '<div class="badge hot">VERY NEW</div>';
          if (lowLiq) badges += '<div class="badge risk">LOW LIQ</div>';
          if (!isVeryNew && !lowLiq) badges += '<div class="badge new">NEW</div>';

          var shortAddr = token.address ? token.address.slice(0,5) + '...' + token.address.slice(-4) : '';
          var name = token.name || 'Unknown';
          var symbol = token.symbol || '???';

          var iconHtml = token.icon 
            ? '<img src="' + token.icon + '" class="coin-img" onerror="this.style.display=\'none\'">' 
            : '<div class="coin-img"></div>';

          var infoHtml = '';
          if (age) infoHtml += '<span>' + age + ' ago</span>';
          infoHtml += '<span>Liq: ' + formatNumber(token.liquidity) + '</span>';
          infoHtml += '<span>MC: ' + formatNumber(token.marketCap) + '</span>';

          var card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = 
            '<div class="card-top">' +
              '<div class="coin-left">' +
                iconHtml +
                '<div style="min-width:0">' +
                  '<div class="coin-name">' + name + '</div>' +
                  '<div class="coin-symbol">$' + symbol + ' • ' + shortAddr + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="badges">' + badges + '</div>' +
            '</div>' +
            '<div class="info-row">' + infoHtml + '</div>' +
            '<div class="buttons">' +
              '<a class="btn btn-jupiter" href="https://jup.ag/swap/SOL-' + token.address + '" target="_blank">Jupiter</a>' +
              '<a class="btn btn-dex" href="https://dexscreener.com/solana/' + token.address + '" target="_blank">DexScreener</a>' +
              '<a class="btn btn-gmgn" href="https://gmgn.ai/sol/token/' + token.address + '" target="_blank">GMGN</a>' +
              '<a class="btn btn-axiom" href="https://axiom.trade/t/' + token.address + '" target="_blank">Axiom</a>' +
              '<a class="btn btn-photon" href="https://photon-sol.tinyastro.io/en/lp/' + token.address + '" target="_blank">Photon</a>' +
              '<button class="btn-copy" onclick="copyAddress(\'' + token.address + '\')">Copy CA</button>' +
            '</div>';

          feed.appendChild(card);
        });

      } catch (err) {
        status.textContent = 'Error loading data. Retrying...';
        console.error(err);
      }
    }

    // Load immediately
    loadCoins();

    // Refresh every 18 seconds (much faster)
    setInterval(loadCoins, 18000);
  </script>
</body>
  </html>
