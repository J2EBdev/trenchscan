<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrenchScan – Auto Memecoin Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e11;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 20px 16px 60px;
    }
    .header {
      text-align: center;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 28px;
      font-weight: 800;
      color: #f0b90b;
    }
    .header p {
      color: #848e9c;
      font-size: 14px;
      margin-top: 6px;
    }
    .section {
      background: #1e2329;
      border: 1px solid #2b3139;
      border-radius: 14px;
      padding: 16px;
      margin-bottom: 20px;
    }
    .section h2 {
      font-size: 15px;
      color: #f0b90b;
      margin-bottom: 8px;
    }
    .section p {
      font-size: 13px;
      color: #c0c5ce;
    }
    .status {
      text-align: center;
      color: #848e9c;
      font-size: 13px;
      margin: 16px 0 12px;
    }
    .card {
      background: #161a1e;
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #2b3139;
    }
    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
      margin-bottom: 10px;
    }
    .coin-left {
      display: flex;
      gap: 10px;
      align-items: center;
      flex: 1;
    }
    .coin-img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #2b3139;
      object-fit: cover;
    }
    .coin-name {
      font-size: 15px;
      font-weight: 600;
      line-height: 1.3;
    }
    .coin-symbol {
      font-size: 12px;
      color: #848e9c;
      margin-top: 2px;
    }
    .risk {
      font-size: 11px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .risk.new { background: #2b3139; color: #848e9c; }
    .risk.hot { background: #f0b90b33; color: #f0b90b; }
    .info-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      font-size: 12px;
      color: #848e9c;
      margin-bottom: 12px;
    }
    .info-row span {
      background: #1e2329;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      text-align: center;
      padding: 9px 4px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: white;
    }
    .btn-jupiter { background: #00d18c; }
    .btn-dex { background: #3861fb; }
    .btn-gmgn { background: #f0b90b; color: #0b0e11; }
    .footer {
      text-align: center;
      color: #5e6673;
      font-size: 12px;
      margin-top: 40px;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TrenchScan</h1>
    <p>Auto-analyzing new memecoins so trenchers can move faster</p>
  </div>

  <div class="section">
    <h2>What is TrenchScan?</h2>
    <p>Automatically checks new memecoins in the background so you don’t have to paste Contract Addresses and open many tabs.</p>
  </div>

  <div class="status" id="status">Loading latest tokens...</div>
  <div id="feed"></div>

  <div class="footer">TrenchScan • Built for speed</div>

  <script>
    function formatNumber(num) {
      if (!num) return '—';
      if (num >= 1000000) return '$' + (num / 1000000).toFixed(1) + 'M';
      if (num >= 1000) return '$' + (num / 1000).toFixed(1) + 'K';
      return '$' + Number(num).toFixed(0);
    }

    function getAge(createdAt) {
      if (!createdAt) return null;
      const minutes = Math.floor((Date.now() - createdAt) / 60000);
      if (minutes < 60) return minutes + 'm ago';
      const hours = Math.floor(minutes / 60);
      if (hours < 24) return hours + 'h ago';
      return Math.floor(hours / 24) + 'd ago';
    }

    async function loadCoins() {
      const feed = document.getElementById('feed');
      const status = document.getElementById('status');

      try {
        const res = await fetch('/.netlify/functions/get-tokens');
        const data = await res.json();

        if (!Array.isArray(data) || data.length === 0) {
          status.textContent = 'No tokens found right now. Try refreshing.';
          return;
        }

        status.textContent = 'Showing ' + data.length + ' latest Solana tokens';

        feed.innerHTML = '';

        data.forEach(function(token) {
          const age = getAge(token.createdAt);
          const isVeryNew = age && age.includes('m') && parseInt(age) < 30;

          const card = document.createElement('div');
          card.className = 'card';

          const iconHtml = token.icon 
            ? '<img src="' + token.icon + '" class="coin-img" onerror="this.style.display=\'none\'">' 
            : '<div class="coin-img"></div>';

          card.innerHTML = `
            <div class="card-top">
              <div class="coin-left">
                ${iconHtml}
                <div>
                  <div class="coin-name">${token.name || 'Unknown'}</div>
                  <div class="coin-symbol">$${token.symbol || '???'} • \( {token.address.slice(0,6)}... \){token.address.slice(-4)}</div>
                </div>
              </div>
              <div class="risk \( {isVeryNew ? 'hot' : 'new'}"> \){isVeryNew ? 'VERY NEW' : 'NEW'}</div>
            </div>

            <div class="info-row">
              ${age ? '<span>' + age + '</span>' : ''}
              <span>Liq: ${formatNumber(token.liquidity)}</span>
              <span>MC: ${formatNumber(token.marketCap)}</span>
            </div>

            <div class="buttons">
              <a class="btn btn-jupiter" href="https://jup.ag/swap/SOL-${token.address}" target="_blank">Jupiter</a>
              <a class="btn btn-dex" href="https://dexscreener.com/solana/${token.address}" target="_blank">DexScreener</a>
              <a class="btn btn-gmgn" href="https://gmgn.ai/sol/token/${token.address}" target="_blank">GMGN</a>
            </div>
          `;

          feed.appendChild(card);
        });

      } catch (err) {
        status.textContent = 'Error loading data. Please try again later.';
        console.error(err);
      }
    }

    loadCoins();
    setInterval(loadCoins, 90000);
  </script>
</body>
</html>
