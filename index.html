<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TrenchScan – Auto Memecoin Analyzer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0b0e11;
      color: #eaecef;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      line-height: 1.5;
      padding: 16px;
      padding-bottom: 60px;
    }
    .header {
      text-align: center;
      padding: 20px 0 16px;
      border-bottom: 1px solid #1e2329;
      margin-bottom: 20px;
    }
    .header h1 {
      font-size: 26px;
      font-weight: 700;
      color: #f0b90b;
    }
    .header p {
      color: #848e9c;
      font-size: 13px;
      margin-top: 4px;
    }
    .status {
      text-align: center;
      color: #848e9c;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .card {
      background: #1e2329;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
      border: 1px solid #2b3139;
    }
    .coin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      gap: 8px;
    }
    .coin-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .coin-img {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #2b3139;
      object-fit: cover;
    }
    .coin-name {
      font-size: 16px;
      font-weight: 600;
    }
    .coin-symbol {
      font-size: 12px;
      color: #848e9c;
    }
    .risk {
      padding: 3px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .risk.unknown { background: #2b3139; color: #848e9c; }
    .info {
      font-size: 12px;
      color: #848e9c;
      margin-bottom: 8px;
    }
    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 10px;
    }
    .tag {
      background: #2b3139;
      padding: 2px 7px;
      border-radius: 6px;
      font-size: 11px;
    }
    .buttons {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .btn {
      flex: 1;
      min-width: 90px;
      text-align: center;
      padding: 8px 6px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      color: white;
    }
    .btn-jupiter { background: #00d18c; }
    .btn-dex { background: #3861fb; }
    .btn-gmgn { background: #f0b90b; color: #0b0e11; }
    .footer {
      text-align: center;
      color: #5e6673;
      font-size: 12px;
      margin-top: 30px;
    }
    .loading {
      text-align: center;
      padding: 40px 0;
      color: #848e9c;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>TrenchScan</h1>
    <p>Auto-analyzing new memecoins • No CA needed</p>
  </div>

  <div class="status" id="status">Loading real data from DexScreener...</div>
  <div id="feed"></div>

  <div class="footer">
    TrenchScan • Real data from DexScreener • More features coming soon
  </div>

  <script>
    async function loadCoins() {
      const feed = document.getElementById('feed');
      const status = document.getElementById('status');

      try {
        // Fetch latest token profiles (free public API)
        const res = await fetch('https://api.dexscreener.com/token-profiles/latest/v1');
        const data = await res.json();

        // Filter only Solana tokens
        const solanaTokens = data.filter(t => t.chainId === 'solana').slice(0, 15);

        if (solanaTokens.length === 0) {
          status.textContent = 'No new Solana tokens found right now. Try refreshing.';
          return;
        }

        status.textContent = `Showing ${solanaTokens.length} latest Solana tokens • Updated just now`;

        feed.innerHTML = '';

        solanaTokens.forEach(token => {
          const address = token.tokenAddress;
          const name = token.description ? token.description.slice(0, 30) : 'Unknown';
          const icon = token.icon || '';
          const url = token.url || `https://dexscreener.com/solana/${address}`;

          const card = document.createElement('div');
          card.className = 'card';
          card.innerHTML = `
            <div class="coin-header">
              <div class="coin-left">
                \( {icon ? `<img src=" \){icon}" class="coin-img" onerror="this.style.display='none'">` : ''}
                <div>
                  <div class="coin-name">${name}</div>
                  <div class="coin-symbol">\( {address.slice(0,6)}... \){address.slice(-4)}</div>
                </div>
              </div>
              <div class="risk unknown">NEW</div>
            </div>
            <div class="info">Solana • Just listed / updated</div>
            <div class="tags">
              <span class="tag">Real Data</span>
              <span class="tag">DexScreener</span>
            </div>
            <div class="buttons">
              <a class="btn btn-jupiter" href="https://jup.ag/swap/SOL-${address}" target="_blank">Jupiter</a>
              <a class="btn btn-dex" href="https://dexscreener.com/solana/${address}" target="_blank">DexScreener</a>
              <a class="btn btn-gmgn" href="https://gmgn.ai/sol/token/${address}" target="_blank">GMGN</a>
            </div>
          `;
          feed.appendChild(card);
        });

      } catch (err) {
        status.textContent = 'Failed to load data. Please refresh the page.';
        console.error(err);
      }
    }

    // Load when page opens
    loadCoins();

    // Auto refresh every 60 seconds
    setInterval(loadCoins, 60000);
  </script>
</body>
  </html>
